skript-deploy:
  # Folder where your scripts repository is cloned.
  repo-folder: "skript-repo"

  # Folder inside the repo that contains .sk files.
  repo-scripts-folder: "scripts"

  # Skript script folder on the server.
  skript-scripts-folder: "plugins/Skript/scripts"

  # Full backup of scripts before each successful deploy with script changes.
  backup-folder: "plugins/beans/skript-backups"
